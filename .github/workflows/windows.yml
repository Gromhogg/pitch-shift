# Pitch Shift for Windows (beta): build and test on GitHub's Windows computers (x64 and ARM64).
# There's no Windows PC to test on, so these checks do the listening: recordings (WAV) and
# window pictures are uploaded as "artifacts" on each run.
name: Windows

on:
  push:
    branches: [v2-windows]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'install.ps1'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'install.ps1'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            cmake_arch: x64
            rid: win-x64
          - arch: arm64
            runner: windows-11-arm
            cmake_arch: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Build the sound engine, tool and tests
        run: |
          cmake --version
          cmake -S windows -B build -A ${{ matrix.cmake_arch }}
          cmake --build build --config Release --parallel

      - name: Sound math tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Rubber Band check (440 Hz shifted +2 should be 493.9 Hz)
        run: build/out/Release/PitchShiftTool.exe selftest

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the window app
        run: |
          dotnet publish windows/app/PitchShift.csproj -c Release -r ${{ matrix.rid }} `
            -p:EngineDir="${{ github.workspace }}\build\out\Release" -o dist
          Copy-Item build/out/Release/PitchShiftTool.exe dist/
          Get-ChildItem dist | Format-Table Name, Length

      - name: Window pictures
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath dist/PitchShift.exe -ArgumentList '--screenshot', "$PWD\shots\window-${{ matrix.arch }}.png" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'The window app did not finish its picture in time.' }
          ./windows/ci/screenshot.ps1 -Exe dist/PitchShift.exe -Out "$PWD\shots\desktop-${{ matrix.arch }}.png"

      - uses: actions/upload-artifact@v7
        with:
          name: pitchshift-${{ matrix.arch }}
          path: dist/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.arch }}
          path: shots/
          if-no-files-found: ignore

  probe:
    name: probe (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pitchshift-${{ matrix.arch }}
          path: dist

      - name: Install VB-CABLE (virtual audio cable)
        run: ./windows/ci/install-vbcable.ps1

      - name: Allow apps to use the microphone
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name LetAppsAccessMicrophone -Value 1 -PropertyType DWord -Force | Out-Null
          foreach ($root in 'HKLM:', 'HKCU:') {
            $store = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $store -Force | Out-Null
            New-ItemProperty -Path $store -Name Value -Value Allow -PropertyType String -Force | Out-Null
            New-Item -Path "$store\NonPackaged" -Force | Out-Null
            New-ItemProperty -Path "$store\NonPackaged" -Name Value -Value Allow -PropertyType String -Force | Out-Null
          }

      - name: Use the cable as speakers and microphone
        run: |
          dist/PitchShiftTool.exe set-default playback "CABLE Input"
          dist/PitchShiftTool.exe set-default recording "CABLE Output"

      - name: Sound setup before
        run: |
          New-Item -ItemType Directory -Force probe-out | Out-Null
          dist/PitchShiftTool.exe diag | Tee-Object -FilePath probe-out/diag-before.json

      - name: Probe (how app volume affects app recording)
        run: dist/PitchShiftTool.exe probe --out probe-out

      - name: Sound setup after
        if: always()
        run: dist/PitchShiftTool.exe diag | Tee-Object -FilePath probe-out/diag-after.json

      - name: Summary
        if: always()
        run: |
          if (-not (Test-Path probe-out/probe.json)) { exit 0 }
          $r = Get-Content probe-out/probe.json -Raw | ConvertFrom-Json
          $lines = @("## Probe ($($r.machine), $($r.os))", '', "Recommended quieting mode: **$($r.recommended_mode)**", '',
                     '| check | result | value | meaning |', '|---|---|---|---|')
          foreach ($p in $r.checks.PSObject.Properties) {
            $c = $p.Value
            $mark = if ($null -eq $c.pass) { 'info' } elseif ($c.pass) { 'pass' } else { 'FAIL' }
            $lines += "| $($p.Name) | $mark | $($c.value | ConvertTo-Json -Compress) | $($c.meaning) |"
          }
          $lines += ''
          foreach ($n in $r.notes) { $lines += "- $n" }
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.arch }}
          path: probe-out/
